    const dashboardView = document.getElementById('dashboard-view');

    const userIdDisplay = document.getElementById('user-id-display');
    const logoutBtn = document.getElementById('logout-btn');

    // --- API Configuration ---
    const API_BASE_URL = 'http://localhost:8080/api/auth';
    let isLoginMode = true;

    // --- Functions ---
    function toggleMode() {
        isLoginMode = !isLoginMode;
        hideMessage();

        authView.classList.remove('fade-enter-active');

        if (isLoginMode) {

            toggleText.textContent = "Don't have an account?";
            toggleModeBtn.textContent = 'Sign up';

            formTitle.textContent = 'Create an Account';
            formSubtitle.textContent = 'Enter your information to get started.';
            submitText.textContent = 'Sign Up';
            toggleText.textContent = 'Already have an account?';
            toggleModeBtn.textContent = 'Sign in';
            forgotPasswordContainer.style.display = 'none';
        }
    }

    function showMessage(message, type = 'error') {
        messageBanner.textContent = message;
        messageBanner.className = `mb-6 p-4 rounded-xl text-sm font-medium ${
            type === 'error'
                ? 'bg-red-50 text-red-700 border border-red-100'
                : 'bg-green-50 text-green-700 border border-green-100'
        }`;
        messageBanner.classList.remove('hidden');
    }

    function hideMessage() {
        messageBanner.classList.add('hidden');
        messageBanner.textContent = '';
    }

    function setLoading(isLoading) {
        if (isLoading) {
            submitBtn.disabled = true;
            submitText.innerHTML = `<span class="loader"></span> ${isLoginMode ? 'Signing in...' : 'Creating account...'}`;
        } else {
            submitBtn.disabled = false;
            submitText.textContent = isLoginMode ? 'Sign In' : 'Sign Up';
        }
    }

    // Manage UI based on user authentication state
    function updateAuthUI(user) {
        if (user) {
            // User is signed in
            authView.classList.add('hidden');
            dashboardView.classList.remove('hidden');

            // Assuming your backend returns these fields (Adjust based on your JSON map)
            userEmailDisplay.textContent = user.email || emailInput.value;
            userIdDisplay.textContent = user.customerId || user.id || 'N/A';

            authForm.reset();
        } else {
            // User is signed out
            dashboardView.classList.add('hidden');
            authView.classList.remove('hidden');
            if (!isLoginMode) toggleMode();
            hideMessage();
        }
    }

    // Check for existing session on page load
    window.addEventListener('DOMContentLoaded', () => {
        const savedUser = localStorage.getItem('app_user');
        if (savedUser) {
            updateAuthUI(JSON.parse(savedUser));
        }
    });

    // Handle Form Submission with Spring Boot API
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideMessage();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
            showMessage("Please fill in all fields.");
            return;
        }

        setLoading(true);

        try {
            // Point to your Spring Boot Login or Signup endpoint
            const endpoint = isLoginMode ? `${API_BASE_URL}/login` : `${API_BASE_URL}/signup`;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    // Store user session data in browser
                    localStorage.setItem('app_user', JSON.stringify(data));
                    window.location.href = 'empDash.html';
                    updateAuthUI(data);
                } else {
                    // For signup, switch back to login mode so they can sign in
                    showMessage("Account created successfully! Please sign in.", "success");
                    toggleMode();
                }
            } else {
                // Show error message returned from Spring Boot
                showMessage(data.message || "Authentication failed. Please check your credentials.", "error");
            }
        } catch (error) {
            console.error("Auth Error:", error);
            showMessage("Cannot connect to server. Please ensure the backend is running.", "error");
        } finally {
            setLoading(false);
        }
    });

    // Handle Logout
    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('app_user');
        updateAuthUI(null);
    });

    // Event Listener for the mode toggle
    toggleModeBtn.addEventListener('click', toggleMode);

</script>
</body>
</html>
