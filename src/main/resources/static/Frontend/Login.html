<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AUTOFLIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .login-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 1rem;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .form-control {
            background-color: #2a2a2a;
            border: 1px solid #444;
            color: white;
            padding: 12px;
        }
        .form-control:focus {
            background-color: #2a2a2a;
            border-color: #00e676;
            box-shadow: 0 0 0 0.25rem rgba(0, 230, 118, 0.25);
            color: white;
        }
        .btn-autoflix {
            background-color: #00e676;
            color: #000000;
            font-weight: bold;
            border-radius: 50px;
            border: none;
            transition: all 0.2s ease-in-out;
        }
        .btn-autoflix:hover {
            background-color: #00c853;
            transform: scale(1.02);
        }
    </style>
</head>
<body>

<div class="login-card shadow-lg">
    <h2 class="text-center mb-1 fw-bold" style="color: #00e676;">AUTOFLIX</h2>
    <p class="text-center text-secondary mb-4">Secure System Access</p>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label text-secondary small">Email Address</label>
            <input type="email" id="email" class="form-control" required placeholder="you@autoflix.com">
        </div>

        <div class="mb-4">
            <label class="form-label text-secondary small">Password</label>
            <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <button type="submit" class="btn btn-autoflix w-100 py-2">Sign In</button>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        };

        const response = await fetch('http://localhost:8080/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        if (response.ok) {
            const data = await response.json();

            // Store session data globally
            sessionStorage.setItem('userID', data.id);
            sessionStorage.setItem('userRole', data.role);

            // Route the user based on their database role
            switch(data.role) {
                case 'CUSTOMER':
                    window.location.href = 'index.html'; // Or 'customerDash.html'
                    break;
                case 'ADMIN':
                    window.location.href = 'adminDash.html';
                    break;
                case 'MECHANIC':
                    window.location.href = 'empDash.html';
                    break;
                default:
                    window.location.href = 'index.html';
            }
        } else {
            alert("Authentication failed. Please check your email and password.");
        }
    });
</script>
</body>
</html>
