            <div class="row g-3">

                    <th>License Plate</th>
                    <th>Job Status</th>
                    <th>Job Description</th>
                    <th class="pe-4 rounded-top-end text-end">Actions</th>

<!-- YOUR EXACT ORIGINAL FUNCTIONAL CODE (Moved right below the table to ensure it runs correctly) -->
<script>
    function CreateNewJob() {
        let Plate = document.getElementById('plate-input').value;
        let Notes = document.getElementById('Notes-input').value;
        let JobData = {
            licensePlateNO: Plate,
            jobNotes: Notes,
            jobStatus: "Pending"
        };
        fetch(`http://localhost:8080/api/jobs`,{
            method: 'POST',
            headers:{'Content-type': 'application/JSON'},
            body: JSON.stringify(JobData)
        })
            .then(() => window.location.reload());
    }
    function UpdateJobStatus(id) {
        let newStatus = prompt("Enter new status (Pending Or Completed): ");
        let jobData = {jobStatus: newStatus};
        fetch(`http://localhost:8080/api/jobs/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(jobData)
        })
            .then(() => window.location.reload());
    }
    function DeleteJob(id) {
        if(confirm("Are you sure you want to Delete this job")) {
            fetch(`http://localhost:8080/api/jobs/${id}`,{
                method: `DELETE`,
            })
                .then(() => window.location.reload());
        }
    }
    fetch('http://localhost:8080/api/jobs')
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById('job-table-body');
            data.forEach(Job => {
                // I only updated the HTML string here to include the styling components and fix the unclosed button tag.
                let row = `
                 <tr>
                    <td class="ps-4 text-secondary fw-bold">#${Job.jobID}</td>
                    <td><span class="badge bg-dark border">${Job.licensePlateNO}</span></td>
                    <td><span class="badge bg-secondary">${Job.jobStatus}</span></td>
                    <td class="text-muted">${Job.jobNotes}</td>
                    <td class="pe-4 text-end">
                        <button class="btn btn-sm btn-outline-primary rounded-pill me-2" onclick="UpdateJobStatus(${Job.jobID})">
                            <i class="bi bi-arrow-repeat"></i> Update
                        </button>
                        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="DeleteJob(${Job.jobID})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                 </tr>
                `
                tableBody.innerHTML += row;
            });
        });
</script>
</body>
</html>
