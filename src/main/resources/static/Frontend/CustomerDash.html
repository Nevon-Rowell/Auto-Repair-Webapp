<head>

</head>

            <a class="navbar-brand" href="#">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="indexbackup.html" aria-current="page">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Services</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="#">About Us</a></li>

                <form class="d-flex mx-auto w-50">

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                    <!-- PROFILE ICON ADDED HERE -->
                    <li class="nav-item ms-3">

<!-- Dashboard Area -->
<div class="container" id="customer-dashboard-area">
    <h2 class="fw-bold mb-4">My Vehicles & Repair History</h2>
    <div class="row mb-4">
        <div class="col-md-12">
            <input type="text" id="job-search-input" class="form-control form-control-lg shadow-sm"
                   placeholder="Search by License Plate, Vehicle Make, or Status..." onkeyup="filterDashboard()">
        </div>
    </div>

    <h4 class="text-primary mb-3">Current Jobs</h4>
    <table class="table table-hover table-bordered shadow-sm mb-5 bg-white">
        <thead class="table-dark">
        <tr>
            <th>Job ID</th>
            <th>License Plate</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody id="current-jobs-body"></tbody>
    </table>

    <h4 class="text-secondary mb-3">Past History</h4>
    <table class="table table-hover table-bordered shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Job ID</th>
            <th>License Plate</th>
            <th>Status</th>
            <th>Notes</th>
            <th>Total Paid</th>
        </tr>
        </thead>
        <tbody id="history-jobs-body"></tbody>
    </table>
</div>
    <!-- JOB PAYMENT SETTLEMENT MODAL -->
    <div class="modal fade" id="jobPaymentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 bg-dark text-light border border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title fw-bold text-success"><i class="bi bi-shield-lock me-2"></i>Settle Repair Invoice</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="settle-job-id">
                    <div class="text-center mb-4 p-3 rounded-3" style="background-color: #1e1e1e;">
                        <span class="text-secondary small text-uppercase">Total Amount Due</span>
                        <h2 class="fw-bold text-success mb-0" id="settle-amount">$0.00</h2>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">Cardholder Name</label>
                        <input type="text" class="form-control bg-black text-light border-secondary rounded-3" placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">Card Number</label>
                        <input type="text" class="form-control bg-black text-light border-secondary rounded-3" placeholder="4532 •••• •••• 8890">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Expiry Date</label>
                            <input type="text" class="form-control bg-black text-light border-secondary rounded-3" placeholder="MM/YY">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">CVV</label>
                            <input type="password" class="form-control bg-black text-light border-secondary rounded-3" placeholder="123">
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success rounded-pill px-4" style="background-color: #00e676; color: #000;" onclick="submitJobSettlement()">Confirm & Pay</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function openJobPaymentModal(jobId, price) {
            document.getElementById('settle-job-id').value = jobId;
            document.getElementById('settle-amount').innerText = `$${price.toFixed(2)}`;
            var modal = new bootstrap.Modal(document.getElementById('jobPaymentModal'));
            modal.show();
        }

        function submitJobSettlement() {
            const jobId = document.getElementById('settle-job-id').value;

            fetch(`http://localhost:8080/api/jobs/${jobId}/settle`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentMethod: "Card" })
            })
                .then(res => res.json())
                .then(() => {
                    alert("Payment settled successfully!");
                    bootstrap.Modal.getInstance(document.getElementById('jobPaymentModal')).hide();
                    location.reload();
                })
                .catch(err => console.error("Error settling payment:", err));
        }
    </script>

<script>
    let masterJobList = [];

    // Fetch data immediately when this page loads
    document.addEventListener("DOMContentLoaded", () => {
        const customerId = sessionStorage.getItem("userID");
        const role = sessionStorage.getItem("userRole");

        // Security check: Kick them back to home if they aren't a logged-in customer
        if (!customerId || role !== "CUSTOMER") {
            window.location.href = "index.html";
            return;
        }

        // Fetch the jobs for this specific customer
        fetch(`http://localhost:8080/api/jobs/customer/${customerId}`)
            .then(response => response.json())
            .then(data => {
                masterJobList = data;
                renderDashboard(masterJobList);
            })
            .catch(error => console.error("Error fetching jobs:", error));
    });

    function renderDashboard(jobsToRender) {
        const currentBody = document.getElementById("current-jobs-body");
        const historyBody = document.getElementById("history-jobs-body");

        currentBody.innerHTML = "";
        historyBody.innerHTML = "";

        jobsToRender.forEach(job => {
            let badgeColor = "warning text-dark";
            if (job.jobStatus === "Completed") badgeColor = "success";
            else if (job.jobStatus === "In Progress") badgeColor = "primary";

            let rowHtml = `
                    <tr>
                        <td>${job.jobID}</td>
                        <td>${job.licensePlate} <br><small class="text-muted">${job.vehicleInfo}</small></td>
                        <td><span class="badge bg-${badgeColor}">${job.jobStatus}</span></td>
                        <td>${job.jobNotes}</td>
                        <td>$${job.price.toFixed(2)}</td>
                    </tr>
                `;

            if (job.jobStatus === "Completed") {
                historyBody.innerHTML += rowHtml;
            } else {
                currentBody.innerHTML += rowHtml;
            }
        });
    }

    function filterDashboard() {
        const query = document.getElementById("job-search-input").value.toLowerCase();
        const filteredJobs = masterJobList.filter(job =>
            (job.licensePlate && job.licensePlate.toLowerCase().includes(query)) ||
            (job.vehicleInfo && job.vehicleInfo.toLowerCase().includes(query)) ||
            (job.jobStatus && job.jobStatus.toLowerCase().includes(query)) ||
            (job.jobNotes && job.jobNotes.toLowerCase().includes(query))
        );
        renderDashboard(filteredJobs);
    }
</script>
</body>
</html>
