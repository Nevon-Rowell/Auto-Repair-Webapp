<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Job Dashboard - Autoflix</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="job-styles.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="FB_IMG_1787760750663_cropped.jpg" alt="Logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" href="#" aria-current="page">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Services</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">More</a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#">About Us</a></li>
                        <li><a class="dropdown-item" href="#">Contact</a></li>
                    </ul>
                </li>
            </ul>

            <form class="d-flex mx-auto w-50">
                <input class="form-control me-2 rounded-pill" type="search" placeholder="Search..." aria-label="Search"/>
                <button class="btn btn-outline-light rounded-pill px-4" type="submit">Search</button>
            </form>

            <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
                <li class="nav-item ms-3">
                    <a class="nav-link text-white fs-4" href="Login.html" title="User Profile / Login">
                        <i class="bi bi-person-circle"></i>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- MAIN CONTAINER -->
<div class="container mt-5 mb-5">

    <!-- HEADER & ACTION BUTTON -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Active Service Jobs</h2>
            <p class="text-secondary">Manage and update current vehicle repairs.</p>
        </div>
        <!-- Trigger for the "Separate Thing" (Modal) to add a job -->
        <button class="btn btn-green rounded-pill px-4 py-2 shadow" data-bs-toggle="modal" data-bs-target="#addJobModal">
            <i class="bi bi-plus-circle me-2"></i> Log New Job
        </button>
    </div>

    <!-- JOB LIST TABLE -->
    <div class="card rounded-4 shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Job ID</th>
                        <th>License Plate</th>
                        <th>Status</th>
                        <th>Service Description</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="job-table-body">
                    <!-- Rows injected via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ========================================== -->
<!-- ADD NEW JOB MODAL (The "Separate Thing") -->
<!-- ========================================== -->
<div class="modal fade" id="addJobModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-success"><i class="bi bi-tools me-2"></i>Create Service Record</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="newJobForm">
                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">License Plate</label>
                        <input type="text" class="form-control rounded-3" id="plate-input" placeholder="e.g. ABC-1234" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Brand Name</label>
                            <input type="text" class="form-control rounded-3" id="brand-input" placeholder="e.g. Toyota" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label text-secondary small text-uppercase fw-bold">Model</label>
                            <input type="text" class="form-control rounded-3" id="model-input" placeholder="e.g. Camry" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">Mileage</label>
                        <input type="number" class="form-control rounded-3" id="mileage-input" placeholder="e.g. 45000" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">Predetermined Service</label>
                        <select class="form-select rounded-3" id="service-dropdown" required>
                            <option value="" selected disabled>Select a primary service...</option>
                            <option value="Standard Oil Change">Standard Oil Change</option>
                            <option value="Brake Pad Replacement">Brake Pad Replacement</option>
                            <option value="Engine Diagnostics">Engine Diagnostics</option>
                            <option value="Tire Rotation & Alignment">Tire Rotation & Alignment</option>
                            <option value="Full Vehicle Restoration">Full Vehicle Restoration</option>
                            <option value="Battery Replacement">Battery Replacement</option>
                            <option value="Custom Repair">Other / Custom Repair</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label text-secondary small text-uppercase fw-bold">Additional Notes</label>
                        <textarea class="form-control rounded-3" id="notes-input" rows="3" placeholder="Customer requests, specific parts needed, or exact damage details..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-green rounded-pill px-4" onclick="CreateNewJob()">Submit Job</button>
            </div>
        </div>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Application Logic -->
<script>
    const API_URL = 'http://localhost:8080/api/jobs';

    // 1. Create a New Job
    function CreateNewJob() {
        let plate = document.getElementById('plate-input').value;
        let brand = document.getElementById('brand-input').value;
        let model = document.getElementById('model-input').value;
        let mileage = document.getElementById('mileage-input').value;
        let selectedService = document.getElementById('service-dropdown').value;
        let additionalNotes = document.getElementById('notes-input').value;

        if(!plate || !selectedService) {
            alert("Please provide both a License Plate and select a Service type.");
            return;
        }

        // Combine vehicle details, service, and notes into the single jobNotes field
        let combinedNotes = `[${selectedService}] | Vehicle: ${brand} ${model} | Mileage: ${mileage}`;
        if (additionalNotes.trim() !== "") {
            combinedNotes += ` - ${additionalNotes}`;
        }

        let JobData = {
            licensePlateNO: plate,
            jobNotes: combinedNotes,
            jobStatus: "Pending"
        };

        fetch(API_URL, {
            method: 'POST',
            headers:{'Content-type': 'application/json'},
            body: JSON.stringify(JobData)
        })
            .then(() => window.location.reload())
            .catch(error => console.error('Error creating job:', error));
    }
    // 2. Update Job Status
    function UpdateJobStatus(id, newStatus) {
        let jobData = {jobStatus: newStatus};
        fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(jobData)
        })
            .then(() => window.location.reload())
            .catch(error => console.error('Error updating status:', error));
    }

    // 3. Delete Job
    function DeleteJob(id) {
        if(confirm("Are you sure you want to permanently delete this job record?")) {
            fetch(`${API_URL}/${id}`, {
                method: 'DELETE',
            })
                .then(() => window.location.reload())
                .catch(error => console.error('Error deleting job:', error));
        }
    }

    // 4. Fetch and Display Jobs on Load
    fetch(API_URL)
        .then(response => response.json())
        .then(data => {
            const tableBody = document.getElementById('job-table-body');
            data.forEach(Job => {

                // Color code the status badges
                let badgeClass = "bg-secondary";
                let statusLower = Job.jobStatus ? Job.jobStatus.toLowerCase() : "";

                if (statusLower.includes("pending")) badgeClass = "bg-warning text-dark";
                if (statusLower.includes("progress")) badgeClass = "bg-info text-dark";
                if (statusLower.includes("complete")) badgeClass = "bg-success text-white";

                let row = `
                     <tr>
                        <td class="ps-4 fw-bold" style="color: var(--af-green);">#${Job.jobID}</td>
                        <td><span class="badge border border-light text-light p-2">${Job.licensePlateNO}</span></td>
                        <td><span class="badge ${badgeClass} p-2">${Job.jobStatus}</span></td>
                        <td class="text-light opacity-75">${Job.jobNotes}</td>
                        <td class="text-end pe-4">
                            <div class="dropdown d-inline">
                                <button class="btn btn-sm btn-outline-green rounded-pill dropdown-toggle me-2" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-arrow-repeat"></i> Status
                                </button>
                                <ul class="dropdown-menu shadow">
                                    <li><a class="dropdown-item" href="#" onclick="UpdateJobStatus(${Job.jobID}, 'Pending')">Pending</a></li>
                                    <li><a class="dropdown-item" href="#" onclick="UpdateJobStatus(${Job.jobID}, 'In Progress')">In Progress</a></li>
                                    <li><a class="dropdown-item" href="#" onclick="UpdateJobStatus(${Job.jobID}, 'Completed')">Completed</a></li>
                                </ul>
                            </div>
                            <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="DeleteJob(${Job.jobID})" title="Delete Job">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                     </tr>
                          `;
                tableBody.innerHTML += row;
            });
        })
        .catch(error => console.error('Error fetching jobs:', error));
</script>
</body>
</html>
